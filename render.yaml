services:
  - type: web
    name: portrack
    env: node
    plan: free
    buildCommand: npm install --only=production --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portrack-db
          property: connectionString

databases:
  - name: portrack-db
    plan: free
